services:
  db:
    image: postgres:16-alpine
    container_name: amralt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: amralt
      POSTGRES_PASSWORD: amralt
      POSTGRES_DB: amralt
    ports:
      - "55432:5432"
    volumes:
      - amralt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amralt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amralt_pgdata:
